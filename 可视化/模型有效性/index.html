<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型有效性</title>
    <link rel="stylesheet" href="../shared/edge_float.css">
    <link rel="stylesheet" href="./model_validity.css">
</head>

<body class="page-model-validity">
    <div class="model-validity-zoom-content" style="--model-validity-zoom: 1.25; width: 100%;">
        <header class="model-validity-header">
            <div class="brand">量化研究工作台</div>
            <div class="model-validity-title">
                <span class="eyebrow">MODEL VALIDITY</span>
                <h1>模型有效性</h1>
            </div>
            <div class="model-validity-header-actions">
                <a class="model-live-link" href="../实盘面/index.html">实盘面</a>
                <div class="model-validity-zoom-controls" aria-label="页面缩放">
                    <span class="model-validity-zoom-label">缩放</span>
                    <button id="model-validity-zoom-decrease" type="button" title="缩小页面">−</button>
                    <output id="model-validity-zoom-value" for="model-validity-zoom-decrease model-validity-zoom-increase">125%</output>
                    <button id="model-validity-zoom-reset" type="button" title="恢复 125%">恢复</button>
                    <button id="model-validity-zoom-increase" type="button" title="放大页面">＋</button>
                </div>
                <div id="page-clock" class="page-clock">Time: --</div>
            </div>
        </header>

        <main class="model-validity-shell">
            <section class="monitor-status" aria-label="页面状态">
                <div><span class="status-kicker">THEORETICAL MONITOR</span><strong id="style-monitor-as-of">账本日期：--</strong><span id="style-monitor-message">只读账本</span></div>
                <div class="monitor-actions"><span class="paper-note">理论监控：T 日收盘信号与 T 日收盘理论成交，不代表可实盘成交</span><button id="style-monitor-update" type="button" title="手动更新" aria-label="手动更新">↻</button></div>
            </section>
            <section id="style-summary-rankings" class="summary-rankings" aria-label="风格强弱排名"></section>
            <section class="range-toolbar" aria-label="曲线范围">
                <span class="toolbar-label">净值区间</span>
                <div class="range-switch" role="group" aria-label="净值区间">
                    <button type="button" data-range="20d">20D</button><button type="button" data-range="60d" class="active">60D</button><button type="button" data-range="ytd">YTD</button><button type="button" data-range="all">全部</button>
                </div>
                <span id="style-monitor-progress" class="monitor-progress" aria-live="polite"></span>
            </section>
            <div id="style-monitor-state" class="page-state" role="status">正在读取账本...</div>
            <section id="style-chart-grid" class="model-chart-grid" aria-label="风格组合曲线"></section>
        </main>
    </div>

    <div id="edge-float-cluster" class="edge-float-cluster" data-dock="right">
        <div id="edge-float-hud" class="edge-float-hud" role="note" aria-label="侧边浮标">
            <canvas id="edge-float-mangekyo-canvas" class="edge-float-mangekyo-canvas" width="600" height="600"
                aria-hidden="true"></canvas>
        </div>
    </div>
    <div id="edge-float-menu" class="edge-float-menu" role="menu" aria-hidden="true"></div>

    <aside id="style-detail-drawer" class="style-detail-drawer" aria-hidden="true">
        <div class="drawer-head"><div><span class="status-kicker">PORTFOLIO DETAIL</span><h2 id="style-detail-title">组合明细</h2></div><button id="style-detail-close" type="button" title="关闭明细" aria-label="关闭明细">×</button></div>
        <div class="drawer-tabs"><button type="button" class="active" data-detail-tab="positions">持仓</button><button type="button" data-detail-tab="trades">交易</button><span class="drawer-tab-spacer"></span><button type="button" class="active" data-detail-leg="high">高分腿</button><button type="button" data-detail-leg="low">低分腿</button></div>
        <div id="style-detail-content" class="drawer-content"></div>
    </aside>

    <script>window.PAGE_VIEW = "model-validity";</script>
    <script defer src="../shared/lightweight-charts.standalone.production.js"></script>
    <script defer src="../shared/edge_float_nav.js"></script>
    <script defer src="../shared/edge_float_mangekyo_canvas.js"></script>
    <script defer src="../shared/edge_float_hud.js"></script>
    <script defer src="./model_validity.js"></script>
</body>

</html>
